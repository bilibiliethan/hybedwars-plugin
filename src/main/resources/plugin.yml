name: HyBedWars
version: '${project.version}'
main: com.hybedwars.HyBedWars
api-version: '1.20'
authors: [HyBedWars]
description: 仿 Hypixel 起床战争插件，支持单人八队 / 双人八队 / 四人四队 / 四队八人
website: https://www.spigotmc.org/
folia-supported: false

commands:
  bedwars:
    description: 起床战争主命令
    usage: /bw help
    aliases: [bw, qcw, qichuang]

permissions:
  hybedwars.play:
    description: 允许玩家使用基础命令
    default: true
  hybedwars.admin:
    description: 允许管理地图与游戏
    default: op
  hybedwars.*:
    description: 全部权限
    default: op
    children:
      hybedwars.play: true
      hybedwars.admin: true
