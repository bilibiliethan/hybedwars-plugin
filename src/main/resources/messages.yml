    - '&c/bw arena adddiamond &7- 添加钻石生成器'
    - '&c/bw arena addemerald &7- 添加绿宝石生成器'
    - '&c/bw arena toggleexp &7- 开关本地图的经验模式'
    - '&c/bw arena save &7- 保存地图'
    - '&c/bw arena info &7- 查看地图信息'
  modes: '&7可用模式：&e单人八队(solo) &7| &e双人八队(doubles) &7| &e四人四队(quads) &7| &e四队八人(mini) &7| &e经验四队八人(experience)'

