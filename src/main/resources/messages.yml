    - '&c/bw arena setspectator &7- 设置观战点'
    - '&c/bw arena setshop &7- 设置商店 NPC 位置'
    - '&c/bw arena setupgrades &7- 设置升级 NPC 位置'
    - '&c/bw arena setspawn <队伍> &7- 设置队伍出生点'
    - '&c/bw arena setbed <队伍> &7- 站在床上设置队床'
