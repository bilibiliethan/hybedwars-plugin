  help-player:
    - '&e/bw join <模式> &7- 加入一场对局'
    - '&e/bw leave &7- 离开当前对局'
    - '&e/bw list &7- 查看所有地图'
    - '&e/bw stats [玩家] &7- 查看战绩'
    - '&e/bw top &7- 排行榜'
